<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HexaCalculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<div id="loadingScreen">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <h1>Welcome to HexaCalculator</h1>
</div>

<div class="container" id="appContainer">

    <div class="sidebar">
        <div class="sidebar-header">
            <h2>History</h2>
            <button class="clear-btn" onclick="clearHistory()">Clear All</button>
        </div>
        <div id="historyList" class="history-container"></div>
    </div>

    <div class="editor">
        <div class="display-card">
            <div class="editor-header">
                <button class="back-btn" onclick="toggleSidebar()">‹ History</button>
            </div>

            <div class="calculator-container">
                <h1 id="Display">0</h1>
                <div class="buttons">
                    <button class="Button-Number" id="1">1</button>
                    <button class="Button-Number" id="2">2</button>
                    <button class="Button-Number" id="3">3</button>
                    <button class="Button-Operator" id="division">&divide;</button>
                    
                    <button class="Button-Number" id="4">4</button>
                    <button class="Button-Number" id="5">5</button>
                    <button class="Button-Number" id="6">6</button>
                    <button class="Button-Operator" id="multiplication">&times;</button>
                    
                    <button class="Button-Number" id="7">7</button>
                    <button class="Button-Number" id="8">8</button>
                    <button class="Button-Number" id="9">9</button>
                    <button class="Button-Operator" id="subtraction">&minus;</button>  
                    
                    <button class="Button-Number" id="AC">AC</button>
                    <button class="Button-Number" id="0">0</button>
                    <button class="Button-Number" id="Back">&#9003;</button>
                    <button class="Button-Operator" id="addition">&plus;</button>  
                    
                    <button class="Button-Equal" id="equal">=</button>
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
